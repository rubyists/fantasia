schema_version: 1
config_version: 1
project_name: fantasia-feature-example
prompts:
  global_prompt:
    - prompts/global.md
    - prompts/specialized.md
states:
  discover:
    type: agent
    prompt: prompts/phase.md
    transitions: {complete: ground-check}
  ground-check:
    type: agent
    prompt: prompts/phase.md
    session: fresh
    transitions: {complete: design-review}
  design-review:
    type: gate
    rework_to: discover
    max_rework: 3
    transitions: {approve: implement}
  implement:
    type: agent
    prompt: prompts/phase.md
    transitions: {complete: implementation-review}
  implementation-review:
    type: gate
    rework_to: implement
    max_rework: 3
    transitions: {approve: done}
  done:
    type: terminal
