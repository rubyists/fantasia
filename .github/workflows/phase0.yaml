name: Phase 0 contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            architecture: x86_64
          - os: macos-15
            architecture: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
      - run: test "$(uname -m)" = "${{ matrix.architecture }}"
      - run: mise exec -- mix setup
      - run: mise exec -- mix format --check-formatted
      - run: mise exec -- mix test
      - run: mise exec -- mix phase0.verify
